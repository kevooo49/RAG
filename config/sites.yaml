# Single source of truth for: which sites are crawled, how, and which folders get indexed.
# Add a site = add an entry under `sites:`; no Python changes needed.

paths:
  data_root: data/Baza_Wiedzy_AGH
  eval_dir: data/Ewaluacja_Probka
  index_dir: data/Baza_Wektorowa_Chroma_ASYM   # indexer manifest (_manifest_indeksu.json)
  id_prefix: ../../data/Baza_Wiedzy_AGH
layout:
  pages: '{prefix}_Strony'
  raw_documents: '{prefix}_Dokumenty_Surowe'
  processed_documents: '{prefix}_Dokumenty_Przetworzone'
  temp_documents: '{prefix}_Dokumenty_Tymczasowe'
crawl_defaults:
  content_selectors:
  - '#mainContent'
  - main
  - '[role=main]'
  - article
  - '#main'
  - '#content'
  footer_selectors:
  - '#pageFooter'
  - footer
  additional_junk_selectors: []
  excluded_paths: []
  foreign_language_prefixes:
  - /en
  - /de
  - /ru
  - /uk
  - /fr
  - /es
  allowed_languages:
  - pl
  min_chars: 300
  max_depth: 12
  requires_js: false
sites:
  bg:
    prefix: Biblioteka
    start_url: https://bg.agh.edu.pl/
    source: Biblioteka Główna AGH
    pages: true
    documents:
      legal_headers: true
    crawl:
      content_selectors: []
      additional_junk_selectors:
      - '#pageFooter'
      - '#unitMenu'
      - '#mainMenuNav'
      - .skip-to-content
      excluded_paths:
      - /wydarzenia
      - /aktualnosci
      - /galeria
      - /galerie
      - /konferencje
      - /archiwum
      - /blog
      - /webinaria
